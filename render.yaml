# Blueprint de despliegue para Render.
# Spec: https://render.com/docs/blueprint-spec
#
# Uso: en Render, New > Blueprint, apuntando a este repositorio.
# Las variables marcadas como `sync: false` se piden al crear el blueprint.
#
# Dominios custom (ver backend/.env.example para el resto):
#   Frontend -> https://www.simonbolivar4084.com
#   API      -> https://api.simonbolivar4084.com
#
# ALLOWED_ORIGINS y API_URL son valores LITERALES a propósito: antes usaban
# fromService -> RENDER_EXTERNAL_HOSTNAME, que siempre devuelve el hostname
# .onrender.com y nunca el dominio custom. Con dominios propios eso dejaba de
# funcionar (CORS 403 y frontend apuntando a la URL interna).

services:
  # ------------------------------------------------------------------
  # 1) API en Go
  # ------------------------------------------------------------------
  - type: web
    name: inscripciones-sb-api
    runtime: go
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: go build -o api .
    startCommand: ./api
    healthCheckPath: /api/students
    # No recompilar la API cuando solo cambian archivos del frontend
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/tmp_import_test/**
    envVars:
      - key: MONGODB_URI
        sync: false # URI de MongoDB Atlas
      - key: ADMIN_USERNAME
        sync: false # usuario del dashboard (admin)
      - key: ADMIN_PASSWORD
        sync: false # hash bcrypt de la contraseña, entre comillas simples
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Orígenes del frontend. CORS es por ORIGEN (quién llama), no por
        # destino, así que acá va el dominio del sitio, no el de la API.
        # El backend acepta valores con o sin esquema (ver router.go).
        value: https://www.simonbolivar4084.com,https://simonbolivar4084.com

  # ------------------------------------------------------------------
  # 2) Frontend Angular (sitio estático)
  # ------------------------------------------------------------------
  - type: web
    name: inscripciones-sb
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/sb-web/browser
    # No recompilar el sitio cuando solo cambian archivos del backend
    buildFilter:
      paths:
        - frontend/**
      ignoredPaths:
        - frontend/dist/**
    previews:
      generation: off
    routes:
      # SPA: /fechas, /grupos, /admin se resuelven contra index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # URL del backend tal como la ve el navegador. El script set-api-url.js
      # le agrega https:// y /api si faltan.
      - key: API_URL
        value: https://api.simonbolivar4084.com